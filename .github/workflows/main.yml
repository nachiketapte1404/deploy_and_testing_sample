name: Full Stack CI

on:
  push:
    branches: [ "main" ] # Runs whenever you push to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Run Spring Boot Tests
        run: |
          cd backend-folder-name # CHANGE THIS to your backend folder name
          mvn clean test

  docker-build:
    needs: backend-tests # Only build Docker if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: docker build -t spring-api ./deploytesting # CHANGE THIS
        
      - name: Build Frontend Image
        run: docker build -t angular-ui ./task-manager-ui